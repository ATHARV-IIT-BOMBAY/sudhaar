name: Sudhaar
description: Fail the build when code calls Sarvam AI's API with models, voices or parameters the live API rejects.
branding:
  icon: check-circle
  color: orange
inputs:
  path:
    description: File or folder to check
    default: "."
  verify:
    description: Also prove each finding against the live API (needs the sarvam-api-key input)
    default: "false"
  sarvam-api-key:
    description: Sarvam API key, from a repository secret (only used when verify is true)
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SARVAM_API_KEY: ${{ inputs.sarvam-api-key }}
        SUDHAAR_PATH: ${{ inputs.path }}
        SUDHAAR_VERIFY: ${{ inputs.verify }}
      run: |
        flags=""
        if [ "$SUDHAAR_VERIFY" = "true" ] && [ -n "$SARVAM_API_KEY" ]; then flags="--verify"; fi
        python3 "${{ github.action_path }}/sudhaar.py" "$SUDHAAR_PATH" $flags
