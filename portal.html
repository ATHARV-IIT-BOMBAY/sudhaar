<style>
:root{
  --bg:#ffffff; --side:#f7f7f5; --fg:#1a1a1a; --muted:#6b6b6b; --faint:#9a9a9a;
  --line:#e8e8e5; --soft:#f3f3f1; --hover:#ececea; --accent:#1a1a1a; --accent-fg:#fff;
  --err:#b42318; --err-bg:#fef3f2; --warn:#a15c07; --warn-bg:#fffaeb; --ok:#067647; --ok-bg:#ecfdf3;
  --code:#f6f6f4; --serif:"Source Serif 4", Georgia, serif; --sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1b1b1a; --side:#151514; --fg:#ededeb; --muted:#a3a3a0; --faint:#77776f; --line:#2c2c2a; --soft:#242423; --hover:#2a2a28;
  --accent:#ededeb; --accent-fg:#1b1b1a; --err:#fda29b; --err-bg:#3a1a17; --warn:#fec84b; --warn-bg:#33270d; --ok:#75e0a7; --ok-bg:#0f2d1e; --code:#222221}}
:root[data-theme=dark]{
  --bg:#1b1b1a; --side:#151514; --fg:#ededeb; --muted:#a3a3a0; --faint:#77776f; --line:#2c2c2a; --soft:#242423; --hover:#2a2a28;
  --accent:#ededeb; --accent-fg:#1b1b1a; --err:#fda29b; --err-bg:#3a1a17; --warn:#fec84b; --warn-bg:#33270d; --ok:#75e0a7; --ok-bg:#0f2d1e; --code:#222221}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);display:flex}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}

/* sidebar */
aside{width:260px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;height:100vh;position:sticky;top:0}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-family:var(--serif);font-size:22px}
.mark{width:28px;height:28px;flex:none;display:block}

.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.recent button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--fg)}
.nav button:hover,.recent button:hover{background:var(--hover)}
.nav button[aria-current=true]{background:var(--hover)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.label{font-size:13px;color:var(--muted);padding:22px 10px 6px}
.recent{display:flex;flex-direction:column;gap:1px;overflow:auto}
.recent button{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.foot{margin-top:auto;padding:10px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}.dot.on{background:var(--ok)}

/* main */
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden],.hero[hidden],#thread[hidden],.dock[hidden]{display:none}
#thread{flex:1;overflow:auto;padding:28px 20px 12px}
.inner{max-width:760px;margin:0 auto;width:100%}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 20px 10vh}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.4vw,46px);letter-spacing:-.01em;margin:0 0 28px;text-align:center;line-height:1.15}
#composerHome{width:100%;max-width:760px}
.composer{width:100%;max-width:760px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);padding:14px 14px 10px 18px}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--fg);font:16px/1.5 var(--sans);min-height:52px;max-height:180px}
.composer textarea::placeholder{color:var(--faint)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hint{font-size:13px;color:var(--faint)}
.send{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;cursor:pointer}
.send:disabled{background:var(--line);color:var(--faint);cursor:default}
.send svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.note{font-size:12px;color:var(--faint);text-align:center;margin:10px 0 0}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;max-width:760px;margin:36px auto 0}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--faint)}
.card svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:1.6;margin-bottom:10px}
.card b{font-weight:500}.card span{color:var(--muted);font-size:14px;line-height:1.45}
.samples{font-size:14px;color:var(--muted);margin:22px 0 0;text-align:center}
.samples button{background:none;border:0;padding:0;color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.samples button:hover{text-decoration-color:var(--fg)}
.dock{padding:8px 20px 18px}
.label{display:flex;justify-content:space-between;align-items:center}
.label button{background:none;border:0;color:var(--faint);font-size:12px;cursor:pointer;padding:0}
.recent .meta{display:block;font-size:12px;color:var(--faint)}
.recent .meta b{color:var(--err);font-weight:500}

/* messages */
.msg{margin:0 0 26px}
.user{display:flex;justify-content:flex-end}
.user p{background:var(--soft);border-radius:18px;padding:10px 16px;margin:0;max-width:80%;overflow-wrap:anywhere;white-space:pre-wrap}
.bot{display:flex;gap:12px}
.bot .mark{flex:none;margin-top:2px}
.body{flex:1;min-width:0}
.body p{margin:2px 0 10px}
.headline{font-weight:500}
.find{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:6px 0 12px}
.row{padding:12px 14px;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.rtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.tag.error{background:var(--err-bg);color:var(--err)}.tag.warning{background:var(--warn-bg);color:var(--warn)}.tag.info{background:var(--soft);color:var(--muted)}
.loc{font-family:var(--mono);font-size:13px;color:var(--muted)}.loc a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.what{margin:6px 0 0;overflow-wrap:anywhere}
.what code.id{font-family:var(--mono);font-size:13px;background:var(--soft);padding:1px 6px;border-radius:5px}
.fx{font-size:14px;color:var(--muted);margin-top:4px}.fx code{font-family:var(--mono);font-size:13px;color:var(--ok);background:var(--ok-bg);padding:1px 6px;border-radius:5px}
.live{margin-top:8px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.live b.bad{color:var(--err)}.live b.good{color:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 2px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip:hover{background:var(--soft)}.chip:disabled{opacity:.5;cursor:default}
.chip.split{display:inline-flex;align-items:center;gap:2px;padding:0 6px 0 0;overflow:hidden}.chip.split button{border:0;background:none;padding:6px 4px 6px 14px;font-size:14px;cursor:pointer;color:inherit}.chip.split select{border:0;background:none;color:var(--fg);font:inherit;font-size:14px;font-weight:600;padding:6px 18px 6px 2px;cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 9px) 52%,calc(100% - 5px) 52%;background-size:4px 4px;background-repeat:no-repeat}.chip.split:hover{background:var(--soft)}
pre.code{background:var(--code);margin:0;padding:12px 14px;overflow:auto;font:12.5px/1.55 var(--mono);max-height:460px;white-space:pre}
.codebox{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0 10px}
.codebar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 6px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg)}
.copy{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer}
.fixlist{margin:4px 0 8px;padding-left:20px}.fixlist li{margin:3px 0;overflow-wrap:anywhere}
.checks{display:grid;gap:4px;margin:4px 0 6px}.check{font-size:14px}.check .mark2{display:inline-block;width:18px;font-weight:700}
.check.pass .mark2{color:var(--ok)}.check.fail .mark2{color:var(--err)}
.stamp{display:inline-block;font-size:13px;color:var(--ok);background:var(--ok-bg);border-radius:8px;padding:6px 10px;margin:6px 0 0}
pre.diff{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow:auto;font:12.5px/1.55 var(--mono);margin:6px 0 4px;max-height:420px}
pre.diff .add{color:var(--ok)}pre.diff .del{color:var(--err)}pre.diff .hunk{color:var(--faint)}
.speech{font-family:var(--serif);font-size:19px;line-height:1.6}
audio{width:100%;margin-top:6px}
.err{color:var(--err)}
.typing{display:inline-flex;gap:4px;padding:6px 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
.status{font-size:14px;color:var(--muted)}
iframe{flex:1;width:100%;border:0;background:var(--bg)}

@media (max-width:820px){
  body{flex-direction:column}
  aside{width:auto;height:auto;position:static;flex-direction:row;align-items:center;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);gap:6px;overflow-x:auto}
  .logo{padding:0 8px 0 4px;font-size:19px}.nav{flex-direction:row}.label,.recent,.foot{display:none}
  .nav button{white-space:nowrap}
  main{height:auto;min-height:0;flex:1}
  .cards{grid-template-columns:1fr}
  .hero{padding:28px 16px}
}

<script>
const $ = s => document.querySelector(s);
let scan = null, busy = false, hasKey = false;

function el(tag, cls, text) {  // repo content is untrusted: always text, never HTML
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const logo = () => $('#logoTpl').content.firstElementChild.cloneNode(true);
$('#logo').prepend(logo());

// History lives in this browser only (no accounts). Storage can be blocked, so every access is guarded.
const STORE = 'sudhaar.recent.v1';
const recent = (() => { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; } })();
function saveRecent() { try { localStorage.setItem(STORE, JSON.stringify(recent.slice(0, 20))); } catch {} }

const composer = (() => {
  const box = el('form', 'composer');
  const ta = el('textarea'); ta.rows = 2; ta.placeholder = 'Paste a GitHub repo, code or an error, ask for code, or ask a question…'; ta.setAttribute('aria-label', 'Message');
  const row = el('div', 'crow');
  const hint = el('span', 'hint', 'Enter to send  ·  Shift+Enter for a new line');
  const send = el('button', 'send'); send.type = 'submit'; send.setAttribute('aria-label', 'Send'); send.disabled = true;
  send.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
  row.append(hint, send); box.append(ta, row);
  ta.oninput = () => { send.disabled = busy || !ta.value.trim(); ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 180) + 'px'; };
  ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); box.requestSubmit(); } };
  box.onsubmit = e => { e.preventDefault(); const v = ta.value.trim(); if (!v || busy) return; ta.value = ''; ta.oninput(); handle(v); };
  return {box, ta, send};
})();
$('#composerHome').append(composer.box);

function setBusy(on) {
  busy = on;
  composer.send.disabled = on || !composer.ta.value.trim();
  document.querySelectorAll('.chip, .chip.split button, .chip.split select, .card').forEach(b => b.disabled = on);
}

function toThread() {
  if (!$('#thread').hidden) return;
  $('#hero').hidden = true; $('#thread').hidden = false; $('#dock').hidden = false;
  $('#dock').append(composer.box);
  const n = el('p', 'note', 'Sudhaar checks code against Sarvam’s live API. Your repo is only read, never changed.');
  $('#dock').append(n);
}

function scrollEnd() { const t = $('#thread'); t.scrollTop = t.scrollHeight; }

function userMsg(text) {
  const m = el('div', 'msg user'); m.append(el('p', null, text)); $('#msgs').append(m); scrollEnd();
}

function botMsg() {
  const m = el('div', 'msg bot');
  const body = el('div', 'body');
  m.append(logo(), body);
  $('#msgs').append(m);
  const t = el('span', 'typing'); t.append(el('i'), el('i'), el('i')); body.append(t);
  scrollEnd();
  return body;
}

async function call(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

const isRepo = v => /^(github:|https?:\/\/github\.com\/)/i.test(v) || v === 'demo_app' || /^[\w.-]+\/[\w.-]+$/.test(v);
const norm = v => (/^[\w.-]+\/[\w.-]+$/.test(v) && v !== 'demo_app' ? 'github:' + v : v);

const isWrite = v => /^(please\s+)?(write|generate|create|make|build|give me|show me|code for|likho|likh)\b/i.test(v)
  && /\b(code|function|script|snippet|program|app|bot|assistant|example|agent)\b/i.test(v);
const isError = v => /(Traceback|"error"\s*:|Validation Error|_error\b|TypeError|NoneType|status code \d{3}|\b(400|402|403|413|422|429|500|502|503)\b[^\n]{0,40}(error|Error|Bad Request|Too Many|Unprocessable|Payment))/.test(v)
  && !/^\s*(import |from |def |const |function )/m.test(v);
const isCode = v => v.includes('\n') && /(model|speaker|api\.sarvam|sarvamai|bulbul|saaras|saarika|import |def |function|=>|const |require\()/.test(v);

async function handle(text) {
  toThread(); showChat();
  if (isRepo(text)) return doScan(norm(text));
  if (isError(text)) return doExplainError(text);
  if (isCode(text)) return doScanCode(text);
  if (isWrite(text)) return doWrite(text);
  userMsg(text);
  const body = botMsg(); setBusy(true);
  try {
    const d = await call('/api/ask', {id: scan && scan.id, question: text});
    body.textContent = '';
    d.answer.split(/\n+/).forEach(p => {
      const para = el('p', 'what');
      p.replace(/\*\*/g, '').split('`').forEach((part, k) => para.append(k % 2 ? el('code', 'id', part) : part));
      body.append(para);
    });
  } catch (e) { body.textContent = ''; body.append(el('p', 'err', e.message)); }
  finally { setBusy(false); scrollEnd(); }
}

function liveLine(lv) {
  const d = el('div', 'live');
  d.append('Live API ');
  d.append(el('b', lv.before === 200 ? 'good' : 'bad', String(lv.before)));
  if (lv.before_msg) d.append(' · ' + lv.before_msg);
  if (lv.after != null) { d.append('  →  with fix '); d.append(el('b', lv.after === 200 ? 'good' : 'bad', lv.after === 200 ? '200 OK' : String(lv.after))); }
  return d;
}

function findings(s) {
  const box = el('div', 'find');
  for (const i of s.issues) {
    const row = el('div', 'row');
    const top = el('div', 'rtop');
    top.append(el('span', 'tag ' + i.severity, i.severity === 'error' ? 'Fails' : i.severity === 'warning' ? 'Warning' : 'Note'));
    const loc = el('span', 'loc');
    if (s.gh) { const a = el('a', null, `${i.file}:${i.line}`); a.href = `https://github.com/${s.gh}/blob/HEAD/${i.file}#L${i.line}`; a.target = '_blank'; a.rel = 'noopener'; loc.append(a); }
    else loc.textContent = `${i.file}:${i.line}`;
    const what = el('div', 'what');
    i.msg.split('`').forEach((part, k) => what.append(k % 2 ? el('code', 'id', part) : part));  // `x` → code, still text-only
    top.append(loc); row.append(top, what);
    if (i.fix) { const f = el('div', 'fx', 'Fix '); f.append(el('code', null, i.fix)); row.append(f); }
    if (i.live) row.append(liveLine(i.live));
    box.append(row);
  }
  return box;
}

function chips(body) {
  const c = el('div', 'chips');
  const v = el('button', 'chip', 'Prove it live'), f = el('button', 'chip', 'Show the fix');
  // One control: the button speaks in whatever language is picked next to it.
  const speak = el('div', 'chip split');
  const x = el('button', null, '🔊 Explain aloud in');
  const lang = el('select'); lang.setAttribute('aria-label', 'Explanation language');
  for (const [val, t] of [['hi-IN', 'Hindi'], ['mr-IN', 'Marathi'], ['ta-IN', 'Tamil'], ['te-IN', 'Telugu'], ['bn-IN', 'Bengali'], ['kn-IN', 'Kannada'], ['en-IN', 'English']]) { const o = el('option', null, t); o.value = val; lang.append(o); }
  speak.append(x, lang);
  v.onclick = () => doVerify(body); f.onclick = doFix; x.onclick = () => doExplain(lang.value, 'in ' + lang.selectedOptions[0].text);
  c.append(v, f, speak);
  return c;
}

function renderScan(body) {
  body.textContent = '';
  const c = scan.counts;
  const name = scan.gh || (scan.code ? 'your code' : 'the sample app');
  if (!scan.issues.length) { body.append(el('p', 'headline', `No Sarvam compatibility problems in ${name}. Every call looks current.`)); return; }
  const head = c.error ? `Found ${c.error} call${c.error === 1 ? '' : 's'} in ${name} that Sarvam’s API will reject today` : `No failing calls in ${name}`;
  body.append(el('p', 'headline', head + (c.warning ? `, plus ${c.warning} warning${c.warning === 1 ? '' : 's'}.` : '.')));
  body.append(findings(scan));
  if (c.error || c.warning) body.append(chips(body));
}

async function doScan(target) {
  userMsg(target);
  const body = botMsg(); setBusy(true);
  try {
    scan = await call('/api/scan', {target});
    scan.target = target; scan.label = target === 'demo_app' ? 'Sample app' : target.replace(/^github:/, '');
    renderScan(body); remember();
  } catch (e) { body.textContent = ''; body.append(el('p', 'err', e.message)); }
  finally { setBusy(false); scrollEnd(); }
}

async function doExplainError(text) {
  const lines = text.trim().split('\n');
  userMsg(lines.slice(0, 4).join('\n') + (lines.length > 4 ? `\n… (${lines.length} lines)` : ''));
  const body = botMsg(); setBusy(true);
  try {
    const d = await call('/api/explain_error', {error: text, lang: 'en-IN'});
    body.textContent = '';
    if (d.facts.length) {
      body.append(el('p', 'headline', 'Here’s what this Sarvam error means and how to fix it:'));
      const ul = el('ul', 'fixlist');
      for (const f of d.facts) { const li = el('li'); f.split('`').forEach((part, k) => li.append(k % 2 ? el('code', 'id', part) : part)); ul.append(li); }
      body.append(ul);
    }
    d.answer.split(/\n+/).forEach(p => { const para = el('p', 'what'); p.replace(/\*\*/g, '').split('`').forEach((part, k) => para.append(k % 2 ? el('code', 'id', part) : part)); body.append(para); });
  } catch (e) { body.textContent = ''; body.append(el('p', 'err', e.message)); }
  finally { setBusy(false); scrollEnd(); }
}

async function doScanCode(code) {
  const lines = code.trim().split('\n');
  userMsg(lines.slice(0, 4).join('\n') + (lines.length > 4 ? `\n… (${lines.length} lines)` : ''));
  const body = botMsg(); setBusy(true);
  try {
    scan = await call('/api/scan_code', {code});
    scan.target = 'code:' + Date.now(); scan.code = code; scan.label = `Pasted code (${lines.length} lines)`;
    renderScan(body); remember();
  } catch (e) { body.textContent = ''; body.append(el('p', 'err', e.message)); }
  finally { setBusy(false); scrollEnd(); }
}

// Write it right: Sarvam-105B writes, Sudhaar fixes and live-tests every Sarvam call before showing it.
async function doWrite(request) {
  userMsg(request);
  const body = botMsg(); setBusy(true);
  try {
    const d = await call('/api/write', {request});
    body.textContent = '';
    const ok = d.checks.length && d.checks.every(c => c.status === 200) && !d.remaining.error;
    body.append(el('p', 'headline', ok ? 'Here’s code that works on Sarvam’s API right now.' :
      d.checks.length ? 'Here’s the code. Some calls still fail, details below.' : 'Here’s the code. It has no explicit Sarvam model to test.'));
    if (d.corrections.length) {
      body.append(el('p', null, `Sarvam-105B got ${d.corrections.length} thing${d.corrections.length === 1 ? '' : 's'} wrong. Sudhaar fixed ${d.corrections.length === 1 ? 'it' : 'them'} before showing you the code:`));
      const ul = el('ul', 'fixlist');
      for (const c of d.corrections) {
        const li = el('li'); li.append(el('span', 'loc', `line ${c.line} `));
        c.msg.split('`').forEach((part, k) => li.append(k % 2 ? el('code', 'id', part) : part));
        if (c.fix) { li.append(' → '); li.append(el('code', 'id', c.fix)); }
        ul.append(li);
      }
      body.append(ul);
    }
    const wrap = el('div', 'codebox');
    const bar = el('div', 'codebar'); bar.append(el('span', null, d.language));
    const copy = el('button', 'copy', 'Copy'); copy.onclick = () => { navigator.clipboard.writeText(d.code).then(() => { copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy', 1500); }); };
    bar.append(copy); wrap.append(bar, el('pre', 'code', d.code));
    body.append(wrap);
    if (d.checks.length) {
      const checks = el('div', 'checks');
      for (const c of d.checks) {
        const row = el('div', 'check ' + (c.status === 200 ? 'pass' : 'fail'));
        row.append(el('span', 'mark2', c.status === 200 ? '✓' : '✗'), el('code', 'id', c.call), ` → ${c.status === 200 ? '200 OK' : c.status + ' ' + c.msg}`);
        checks.append(row);
      }
      body.append(checks);
      body.append(el('p', 'stamp', ok ? `Verified live on Sarvam’s API at ${d.at}: every model and voice in this code was called and accepted.` : `Tested live at ${d.at}.`));
    }
  } catch (e) { body.textContent = ''; body.append(el('p', 'err', e.message)); }
  finally { setBusy(false); scrollEnd(); }
}

// A check reopened from history has no server session (the server keeps them in memory only),
// so live actions re-scan once to get a fresh one.
async function withSession(path, extra) {
  const rescan = async () => {
    const s = scan.code ? await call('/api/scan_code', {code: scan.code}) : await call('/api/scan', {target: scan.target});
    Object.assign(scan, {id: s.id, issues: s.issues, counts: s.counts});
  };
  if (!scan.id) await rescan();
  try { return await call(path, {id: scan.id, ...extra}); }
  catch (e) { if (!/expired/i.test(e.message)) throw e; await rescan(); return call(path, {id: scan.id, ...extra}); }
}

async function doVerify(body) {
  userMsg('Prove it against the live API');
  const out = botMsg(); setBusy(true);
  try {
    scan.issues = (await withSession('/api/verify')).issues;
    renderScan(body); remember();
    const n = scan.issues.filter(i => i.live && i.live.before !== 200 && i.live.after === 200).length;
    out.textContent = '';
    out.append(el('p', null, n
      ? `Proof done. This ${scan.code ? 'code' : 'repo'} is broken today: Sarvam’s API returned an error for ${n} of its call${n === 1 ? '' : 's'}. With Sudhaar’s fix, ${n === 1 ? 'that call works' : `all ${n} work`} (200 OK). Click “Show the fix” to get the corrected code.`
      : 'Nothing to prove live here.'));
  } catch (e) { out.textContent = ''; out.append(el('p', 'err', e.message)); }
  finally { setBusy(false); scrollEnd(); }
}

async function doFix() {
  userMsg('Show me the fix');
  const out = botMsg(); setBusy(true);
  try {
    const d = await withSession('/api/fix');
    out.textContent = '';
    out.append(el('p', null, `Here’s the patch. Failing calls go from ${d.before.error} to ${d.after.error}, warnings from ${d.before.warning} to ${d.after.warning}. Applied to a copy only.`));
    const pre = el('pre', 'diff');
    for (const line of d.diff.split('\n')) {
      const cls = line.startsWith('@@') ? 'hunk' : line.startsWith('+') && !line.startsWith('+++') ? 'add' : line.startsWith('-') && !line.startsWith('---') ? 'del' : null;
      pre.append(el('span', cls, line + '\n'));
    }
    out.append(pre);
  } catch (e) { out.textContent = ''; out.append(el('p', 'err', e.message)); }
  finally { setBusy(false); scrollEnd(); }
}

async function doExplain(lang, label) {
  userMsg(`Explain it aloud ${label}`);
  const out = botMsg(); setBusy(true);
  try {
    const d = await withSession('/api/explain', {lang});
    out.textContent = '';
    out.append(el('p', 'speech', d.text));
    const a = el('audio'); a.controls = true; a.src = d.audio; out.append(a); a.play().catch(() => {});
    out.append(el('p', 'status', 'Written by Sarvam-105B, spoken by Bulbul.'));
  } catch (e) { out.textContent = ''; out.append(el('p', 'err', e.message)); }
  finally { setBusy(false); scrollEnd(); }
}

function remember() {  // save this check's report (with any live results) at the top of the history
  const i = recent.findIndex(r => r.target === scan.target);
  if (i >= 0) recent.splice(i, 1);
  recent.unshift({target: scan.target, label: scan.label, code: scan.code, at: Date.now(),
                  scan: {gh: scan.gh, counts: scan.counts, issues: scan.issues}});
  saveRecent(); renderRecent();
}

function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`;
}

function renderRecent() {
  const list = $('#recent'); list.textContent = '';
  if (!recent.length) { list.append(el('span', 'meta', 'Your checks will appear here.')); list.lastChild.style.padding = '0 10px'; return; }
  for (const r of recent.slice(0, 12)) {
    const b = el('button', null, r.label); b.title = r.label;
    const meta = el('span', 'meta');
    if (r.scan.counts.error) meta.append(el('b', null, `${r.scan.counts.error} failing`), ' · ');
    meta.append(ago(r.at));
    b.append(meta);
    b.onclick = () => { if (!busy) openSaved(r); };
    list.append(b);
  }
}

function openSaved(r) {  // instant: show the saved report, no network
  showChat(); $('#msgs').textContent = ''; toThread();
  scan = {id: null, target: r.target, label: r.label, code: r.code, ...JSON.parse(JSON.stringify(r.scan))};
  userMsg(r.code ? r.label : r.target === 'demo_app' ? 'Sample app' : r.target);
  const body = botMsg(); renderScan(body);
  const note = el('p', 'status', `Saved check from ${ago(r.at)}. Send the repo again for a fresh scan.`);
  body.prepend(note); scrollEnd();
}

$('#clearRecent').onclick = () => { recent.length = 0; saveRecent(); renderRecent(); };
renderRecent();

const VIEWS = {navNew: 'chatView', navEco: 'ecoView', navDocs: 'docsView', navTour: 'tourView'};
function showView(nav) {
  for (const [n, v] of Object.entries(VIEWS)) { $('#' + v).hidden = n !== nav; $('#' + n).setAttribute('aria-current', String(n === nav)); }
}
function showChat() { showView('navNew'); }
$('#navEco').onclick = () => showView('navEco');
$('#navDocs').onclick = () => showView('navDocs');
$('#navTour').onclick = () => showView('navTour');

// Buttons on the "Why Sudhaar" page run the real thing in the chat.
const AI_SAMPLE = `import requests, json, base64, io, os, sys, time, threading
from pydub import AudioSegment
from pydub.playback import play

# Explicit model names
STT_MODEL = "sarvam-stt"
CHAT_MODEL = "sarvam-chat"
TTS_MODEL = "sarvam-tts"

CHAT_URL = "https://api.sarvam.ai/chat"
TTS_URL = "https://api.sarvam.ai/text-to-speech"`;
window.tour = kind => {
  if (busy) return;

  if (go) handle(go);
};
$('#navNew').onclick = () => {
  showChat(); scan = null; $('#msgs').textContent = '';
  $('#thread').hidden = true; $('#dock').hidden = true; $('#dock').textContent = '';
  $('#hero').hidden = false; $('#composerHome').append(composer.box); composer.ta.focus();
};
document.querySelectorAll('.card').forEach(c => c.onclick = () => {
  if (busy) return;
  if (c.dataset.action === 'ask') return handle(c.dataset.q);
  if (c.dataset.action === 'write') return (toThread(), showChat(), doWrite(c.dataset.q));
  composer.ta.value = 'https://github.com/'; composer.ta.oninput(); composer.ta.focus();  // "Check my repo": ready to paste
  composer.ta.setSelectionRange(composer.ta.value.length, composer.ta.value.length);
});
document.querySelectorAll('.samples button').forEach(b => b.onclick = () => { if (!busy) handle(b.dataset.t); });

fetch('/api/status').then(r => r.json()).then(s => {
  hasKey = s.key; $('#dot').classList.toggle('on', s.key);
  $('#keyText').textContent = s.key ? 'Connected to Sarvam API' : 'Live features off';
});
composer.ta.focus();
</script>
</body>
